name: RadioFry CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inference and test dependencies
        run: python -m pip install -e ".[dev,ml,gui,fec]"
      - name: Compile sources
        run: python -m compileall -q src gui tests
      - name: Run tests
        run: python -m pytest -q
