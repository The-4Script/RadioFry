[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radiofry"
version = "0.1.0"
description = "Hardware-agnostic RF signal analysis pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "scikit-learn>=1.4"]
gui = ["streamlit>=1.32", "matplotlib>=3.8", "plotly>=5.20"]
fec = ["reedsolo>=1.7", "scikit-commpy>=0.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
